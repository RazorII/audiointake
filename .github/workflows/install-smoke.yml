name: install-smoke

# Installs a published release the way the plugin's skill does (`uv tool install --python 3.14` from
# the release's source archive, which needs no git on the Mac), then checks that the command
# reports the tag's version and that `audiointake doctor --json` exits 3 with `not_set_up`: a fresh
# install with no models yet. Nothing of this checkout is installed.
#
# Safety: started by hand only (workflow_dispatch), with a read-only token and no stored secrets.
# The tag reaches the shell only through an environment variable, and only after it matches
# vX.Y.Z. Action versions are pinned to commit SHAs (tests/test_workflows.py).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to install (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: install-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the input
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.5"   # the uv the plugin's skill installs
      - name: Install the release from its source archive
        run: |
          uv tool install --python 3.14 "https://github.com/RazorII/audiointake/archive/refs/tags/$TAG.tar.gz"
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Version
        run: |
          out="$(audiointake --version)"
          echo "$out"
          [ "$out" = "audiointake ${TAG#v}" ] || { echo "::error::audiointake --version says $out, not audiointake ${TAG#v}"; exit 1; }
      - name: Doctor says not set up
        run: |
          rc=0
          audiointake doctor --json > doctor.json || rc=$?
          cat doctor.json
          [ "$rc" = 3 ] || { echo "::error::doctor exited $rc, expected 3 (not_set_up)"; exit 1; }
          python3 - <<'PY'
          import json, sys
          def codes(x):
              if isinstance(x, dict):
                  if isinstance(x.get("code"), str):
                      yield x["code"]
                  for v in x.values():
                      yield from codes(v)
              elif isinstance(x, list):
                  for v in x:
                      yield from codes(v)
          found = set(codes(json.load(open("doctor.json", encoding="utf-8"))))
          if "not_set_up" not in found:
              sys.exit(f"doctor's JSON has no not_set_up code (found {sorted(found)})")
          PY
